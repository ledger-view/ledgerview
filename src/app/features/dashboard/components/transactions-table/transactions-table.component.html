<table class="mat-elevation-z8" mat-table [dataSource]="transactions">
  <ng-container [matColumnDef]="TableColumn.id">
    <th mat-header-cell *matHeaderCellDef>Id.</th>
    <td mat-cell *matCellDef="let element">{{ element.id }}</td>
  </ng-container>

  <ng-container [matColumnDef]="TableColumn.iban">
    <th mat-header-cell *matHeaderCellDef>IBAN</th>
    <td mat-cell *matCellDef="let element">{{ element.iban }}</td>
  </ng-container>

  <ng-container [matColumnDef]="TableColumn.date">
    <th mat-header-cell *matHeaderCellDef>Date</th>
    <td mat-cell *matCellDef="let element">{{ element.date }}</td>
  </ng-container>

  <ng-container [matColumnDef]="TableColumn.currency">
    <th mat-header-cell *matHeaderCellDef>Currency</th>
    <td mat-cell *matCellDef="let element">{{ element.currency }}</td>
  </ng-container>

  <ng-container [matColumnDef]="TableColumn.category">
    <th mat-header-cell *matHeaderCellDef>Category</th>
    <td mat-cell *matCellDef="let element">{{ element.category }}</td>
  </ng-container>

  <ng-container [matColumnDef]="TableColumn.amount">
    <th mat-header-cell *matHeaderCellDef>Category</th>
    <td mat-cell *matCellDef="let element">{{ element.amount }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
