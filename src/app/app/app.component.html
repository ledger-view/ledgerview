<header>
  <div class="container">
    <a href="/">
      <mat-icon fontIcon="spa" aria-hidden="false"></mat-icon>
      {{ 'theme.title' | translate  }}
    </a>
    @if (identityClaims) {
      <div class="user-details">
        <div class="user">
          <mat-icon fontIcon="account_circle" [matTooltip]="identityClaims.email" aria-hidden="false"></mat-icon>
          {{ identityClaims.name || identityClaims.preferred_username }}
        </div>
        <button mat-icon-button (click)="logout()">
          <mat-icon>logout</mat-icon>
        </button>
      </div>
    }
  </div>
</header>
<div class="container-wrapper">
  <div class="container">
    <router-outlet></router-outlet>
  </div>
</div>
